name: 야영장 빈자리 확인

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정으로 몇 분씩 늦어질 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # state.json 저장용

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 빈자리 확인
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py
      - name: 상태 저장
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add state.json
            git commit -m "상태 갱신"
            git pull --rebase && git push
          fi
